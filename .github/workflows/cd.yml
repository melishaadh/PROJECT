name: CD

# Build the three TrekEasy images, push them to ECR, and roll the ECS Fargate
# services onto the new tag. The infrastructure itself (VPC / ALB / cluster) is
# provisioned once with aws/scripts/provision.sh — this workflow only ships new
# application versions onto it.
#
# Required repo config (Settings -> Secrets and variables -> Actions):
#   Secrets:  AWS_DEPLOY_ROLE_ARN   IAM role this workflow assumes via OIDC
#             SLACK_WEBHOOK_URL     (optional) incoming webhook for #trekeasy
#   Variables: AWS_REGION            e.g. us-east-1
#
# See docs/RUNBOOK.md for the one-time OIDC provider + role setup.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        type: choice
        required: true
        default: staging
        options: [staging, production]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # required for aws-actions/configure-aws-credentials (OIDC)

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20.x

      - name: Backend
        working-directory: backend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test

      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck

  deploy:
    name: Deploy (${{ github.event.inputs.environment || 'staging' }})
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: ${{ github.event.inputs.environment || 'staging' }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      PROJECT_NAME: trekeasy
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push images
        run: ./aws/scripts/build-and-push.sh "$IMAGE_TAG"

      - name: Roll ECS services
        run: ./aws/scripts/deploy.sh "$IMAGE_TAG"

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "channel": "#trekeasy",
              "text": "${{ job.status == 'success' && ':white_check_mark: Deploy succeeded' || ':x: Deploy failed' }} — ${{ github.repository }}@${{ github.sha }} (${{ github.event.inputs.environment || 'staging' }})"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
