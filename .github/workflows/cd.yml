name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        type: choice
        required: true
        default: staging
        options: [staging, production]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Backend
        working-directory: backend
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck

  deploy:
    name: Deploy (${{ github.event.inputs.environment || 'staging' }})
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: |
          docker build -f backend/Dockerfile -t trekeasy-backend:${{ github.sha }} .
          docker build -f frontend/Dockerfile -t trekeasy-frontend:${{ github.sha }} frontend

      - name: Deploy
        run: echo "Deploying trekeasy-backend:${{ github.sha }} to ${{ github.event.inputs.environment || 'staging' }}"
        # Replace with your real rollout command, e.g.:
        #   kubectl set image deployment/backend backend=<registry>/trekeasy-backend:${{ github.sha }} -n myapp

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "channel": "#trekeasy",
              "text": "${{ job.status == 'success' && ':white_check_mark: Deploy succeeded' || ':x: Deploy failed' }} — ${{ github.repository }}@${{ github.sha }} (${{ github.event.inputs.environment || 'staging' }})"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
