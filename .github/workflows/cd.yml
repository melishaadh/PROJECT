name: CD

# Deploys TrekEasy after Jenkins CI has already tested and approved a commit.
#
# Trigger: Jenkins (see Jenkinsfile, stage "Trigger GitHub Actions CD") calls
# the GitHub REST API to dispatch this workflow only after all Jenkins CI
# stages succeed:
#   POST /repos/melishaadh/PROJECT/actions/workflows/cd.yml/dispatches
#   { "ref": "main", "inputs": { "commit_sha": "<jenkins-tested-sha>" } }
#
# This workflow does NOT run automatically on push — Jenkins CI is the gate.
# If Jenkins CI fails, it never calls the dispatch endpoint, so this workflow
# never starts.
#
# It checks out the exact commit Jenkins tested (inputs.commit_sha) and tags
# every image with that same SHA, so the commit Jenkins approved is the exact
# commit that reaches ECS — never a newer/different HEAD on main.
#
# GitHub Actions here is CD only — it does not re-run Jenkins's lint/test/build
# checks. It builds the three images ONCE each and pushes the same immutable
# tag to Docker Hub (secondary/mirror) and the existing ECR repos, then rolls
# the existing ECS Fargate service (trekeasy-service, on trekeasy-cluster)
# onto that tag. Docker Hub repos, ECR repos, the ECS cluster/service,
# DocumentDB and IAM roles all already exist and are managed outside this repo.
#
# Registry auth is handled entirely by official actions (no docker login
# inside aws/scripts/build-and-push.sh):
#   - aws-actions/configure-aws-credentials assumes AWS_DEPLOY_ROLE_ARN via OIDC
#   - aws-actions/amazon-ecr-login logs docker in to ECR and reports the registry
#   - docker/login-action logs docker in to Docker Hub with DOCKERHUB_USERNAME/TOKEN
#
# Required repo config (Settings -> Secrets and variables -> Actions):
#   Secrets:   AWS_DEPLOY_ROLE_ARN   IAM role this workflow assumes via OIDC
#              DOCKERHUB_USERNAME    Docker Hub account (melishaadh)
#              DOCKERHUB_TOKEN       Docker Hub access token
#              SLACK_WEBHOOK_URL     (optional) incoming webhook for #trekeasy
#   Variables: AWS_REGION            ap-south-1
#
# Jenkins side needs one more credential (stored in Jenkins, not here):
#   github-actions-token   a GitHub PAT (repo + workflow scope) used only to
#                          call the dispatch endpoint above.
#
# See docs/RUNBOOK.md for the one-time OIDC provider + role setup.

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA approved by Jenkins"
        required: true
        type: string

concurrency:
  group: cd-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # required for aws-actions/configure-aws-credentials (OIDC)

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      IMAGE_TAG: ${{ inputs.commit_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push images (once each, to ECR + Docker Hub)
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: ./aws/scripts/build-and-push.sh "$IMAGE_TAG"

      - name: Roll ECS service
        run: ./aws/scripts/deploy.sh "$IMAGE_TAG"

  notify:
    name: Notify Slack
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS_OK: ${{ needs.deploy.result == 'success' }}
          REPO: melishaadh/PROJECT
          BRANCH: main
          COMMIT: ${{ inputs.commit_sha }}
          AUTHOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not set, skipping notification"
            exit 0
          fi

          if [ "$STATUS_OK" = "true" ]; then
            STATUS_TEXT=":white_check_mark: CI/CD succeeded"
          else
            STATUS_TEXT=":x: CI/CD failed"
          fi

          payload="$(jq -n \
            --arg text "$STATUS_TEXT" \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg commit "$COMMIT" \
            --arg author "$AUTHOR" \
            --arg run_url "$RUN_URL" \
            '{text: "\($text)\nRepo: \($repo)\nBranch: \($branch)\nCommit: \($commit)\nAuthor: \($author)\nRun: \($run_url)"}')"

          curl -sf -X POST -H 'Content-type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL"
