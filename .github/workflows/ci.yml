name: CI

# Continuous Integration — runs on every push (any branch) and on pull
# requests into main. Installs, lints, type-checks, tests and builds the
# backend and frontend on Node 18 and 20, so a compatibility break shows up
# before merge.
#
# This is separate from Jenkins CI (see ../../Jenkinsfile), which runs the
# same kind of checks and is the one that actually gates deployment: only
# Jenkins succeeding triggers .github/workflows/cd.yml. This workflow does
# not deploy anything.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  APP_ENV: staging

jobs:
  backend:
    name: Backend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist

  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      - if: matrix.node-version == '20.x'
        run: npm run build:web

      - if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-web-dist
          path: frontend/dist
