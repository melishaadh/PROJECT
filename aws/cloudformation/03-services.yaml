AWSTemplateFormatVersion: "2010-09-09"
Description: >
  TrekEasy - Stack 3/3: Services. The ECS Fargate cluster, one task definition
  and one service per tier (frontend / backend / database), wired to the ALB
  target groups and Cloud Map from stack 2. launchType: FARGATE throughout;
  every task runs in the private subnets with no public IP.

Parameters:
  ProjectName:
    Type: String
    Default: trekeasy
  ImageTag:
    Type: String
    Default: latest
    Description: Tag pushed to all three ECR repos (usually the git SHA).
  BackendDesiredCount:
    Type: Number
    Default: 2
  FrontendDesiredCount:
    Type: Number
    Default: 2

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${ProjectName}-cluster"
      ClusterSettings:
        - { Name: containerInsights, Value: enabled }

  # ===========================================================================
  # DATABASE  (MongoDB 7, EFS-backed, reachable only at mongo.trekeasy.local)
  # ===========================================================================
  DatabaseTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-database"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      ExecutionRoleArn: { "Fn::ImportValue": !Sub "${ProjectName}-ExecutionRoleArn" }
      TaskRoleArn: { "Fn::ImportValue": !Sub "${ProjectName}-TaskRoleArn" }
      Volumes:
        - Name: mongo-data
          EFSVolumeConfiguration:
            FilesystemId: { "Fn::ImportValue": !Sub "${ProjectName}-FileSystemId" }
            TransitEncryption: ENABLED
            AuthorizationConfig:
              AccessPointId: { "Fn::ImportValue": !Sub "${ProjectName}-MongoAccessPointId" }
              IAM: DISABLED
      ContainerDefinitions:
        - Name: trekeasy-database
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}-database:${ImageTag}"
          Essential: true
          PortMappings: [{ ContainerPort: 27017 }]
          Environment:
            - { Name: MONGO_INITDB_DATABASE, Value: trekeasy }
          MountPoints:
            - { SourceVolume: mongo-data, ContainerPath: /data/db }
          HealthCheck:
            Command: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1 || exit 1"]
            Interval: 15
            Timeout: 5
            Retries: 5
            StartPeriod: 30
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Sub "/ecs/${ProjectName}-database"
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: database

  DatabaseService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub "${ProjectName}-database"
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      PlatformVersion: "1.4.0"
      DesiredCount: 1
      TaskDefinition: !Ref DatabaseTaskDef
      # One writer only: stop the old task before starting the new one so two
      # mongod never touch the same EFS data directory.
      DeploymentConfiguration: { MinimumHealthyPercent: 0, MaximumPercent: 100 }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Split [",", { "Fn::ImportValue": !Sub "${ProjectName}-PrivateSubnets" }]
          SecurityGroups: [{ "Fn::ImportValue": !Sub "${ProjectName}-DatabaseSgId" }]
      ServiceRegistries:
        - RegistryArn: { "Fn::ImportValue": !Sub "${ProjectName}-MongoDiscoveryArn" }

  # ===========================================================================
  # BACKEND  (NestJS REST + socket.io)
  # ===========================================================================
  BackendTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-backend"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      ExecutionRoleArn: { "Fn::ImportValue": !Sub "${ProjectName}-ExecutionRoleArn" }
      TaskRoleArn: { "Fn::ImportValue": !Sub "${ProjectName}-TaskRoleArn" }
      Volumes:
        - Name: uploads
          EFSVolumeConfiguration:
            FilesystemId: { "Fn::ImportValue": !Sub "${ProjectName}-FileSystemId" }
            TransitEncryption: ENABLED
            AuthorizationConfig:
              AccessPointId: { "Fn::ImportValue": !Sub "${ProjectName}-UploadsAccessPointId" }
              IAM: DISABLED
      ContainerDefinitions:
        - Name: trekeasy-backend
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}-backend:${ImageTag}"
          Essential: true
          PortMappings: [{ ContainerPort: 3001 }]
          Environment:
            - { Name: NODE_ENV, Value: production }
            - { Name: PORT, Value: "3001" }
            - { Name: TRUST_PROXY, Value: "true" }
            - { Name: MONGODB_URI, Value: !Sub "mongodb://mongo.${ProjectName}.local:27017/trekeasy" }
            - Name: CORS_ORIGINS
              Value:
                Fn::Sub:
                  - "http://${Dns}"
                  - Dns:
                      Fn::ImportValue:
                        Fn::Sub: "${ProjectName}-AlbDnsName"
            - Name: PUBLIC_BASE_URL
              Value:
                Fn::Sub:
                  - "http://${Dns}"
                  - Dns:
                      Fn::ImportValue:
                        Fn::Sub: "${ProjectName}-AlbDnsName"
          Secrets:
            - Name: JWT_SECRET
              ValueFrom:
                Fn::Sub:
                  - "${Arn}:JWT_SECRET::"
                  - Arn:
                      Fn::ImportValue:
                        Fn::Sub: "${ProjectName}-JwtSecretArn"
            - Name: JWT_REFRESH_SECRET
              ValueFrom:
                Fn::Sub:
                  - "${Arn}:JWT_REFRESH_SECRET::"
                  - Arn:
                      Fn::ImportValue:
                        Fn::Sub: "${ProjectName}-JwtSecretArn"
          MountPoints:
            - { SourceVolume: uploads, ContainerPath: /app/backend/uploads }
          HealthCheck:
            Command: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3001/api/health | grep -q '\"status\":\"ok\"' || exit 1"]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 20
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Sub "/ecs/${ProjectName}-backend"
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend

  BackendService:
    Type: AWS::ECS::Service
    DependsOn: DatabaseService
    Properties:
      ServiceName: !Sub "${ProjectName}-backend"
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      PlatformVersion: "1.4.0"
      DesiredCount: !Ref BackendDesiredCount
      TaskDefinition: !Ref BackendTaskDef
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration: { MinimumHealthyPercent: 100, MaximumPercent: 200 }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Split [",", { "Fn::ImportValue": !Sub "${ProjectName}-PrivateSubnets" }]
          SecurityGroups: [{ "Fn::ImportValue": !Sub "${ProjectName}-BackendSgId" }]
      LoadBalancers:
        - ContainerName: trekeasy-backend
          ContainerPort: 3001
          TargetGroupArn: { "Fn::ImportValue": !Sub "${ProjectName}-BackendTargetGroupArn" }

  # ===========================================================================
  # FRONTEND  (Expo web export served by nginx on :8080)
  # ===========================================================================
  FrontendTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-frontend"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn: { "Fn::ImportValue": !Sub "${ProjectName}-ExecutionRoleArn" }
      TaskRoleArn: { "Fn::ImportValue": !Sub "${ProjectName}-TaskRoleArn" }
      ContainerDefinitions:
        - Name: trekeasy-frontend
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}-frontend:${ImageTag}"
          Essential: true
          PortMappings: [{ ContainerPort: 8080 }]
          HealthCheck:
            Command: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 10
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Sub "/ecs/${ProjectName}-frontend"
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: frontend

  FrontendService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub "${ProjectName}-frontend"
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !Ref FrontendDesiredCount
      TaskDefinition: !Ref FrontendTaskDef
      HealthCheckGracePeriodSeconds: 30
      DeploymentConfiguration: { MinimumHealthyPercent: 100, MaximumPercent: 200 }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Split [",", { "Fn::ImportValue": !Sub "${ProjectName}-PrivateSubnets" }]
          SecurityGroups: [{ "Fn::ImportValue": !Sub "${ProjectName}-FrontendSgId" }]
      LoadBalancers:
        - ContainerName: trekeasy-frontend
          ContainerPort: 8080
          TargetGroupArn: { "Fn::ImportValue": !Sub "${ProjectName}-FrontendTargetGroupArn" }

Outputs:
  ClusterName:
    Description: ECS cluster name. The app URL is the AppUrl output of the platform stack.
    Value: !Ref Cluster
