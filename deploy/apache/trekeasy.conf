# TrekEasy — alternative/on-prem Apache virtual host, serving the static Expo
# web export on port 8080. An alternative to the nginx reverse proxy in
# deploy/nginx/nginx.conf for environments that standardise on Apache; it
# serves the frontend only (proxy the API separately with mod_proxy if the
# backend is not otherwise reachable).
#
# Requires: mod_rewrite, mod_headers, mod_proxy, mod_proxy_http (for the /api
# proxy block). Enable with: a2enmod rewrite headers proxy proxy_http

Listen 8080

<VirtualHost *:8080>
    ServerName trekeasy.local
    DocumentRoot /var/www/trekeasy/frontend

    <Directory /var/www/trekeasy/frontend>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Client-side routing (expo-router): unknown paths fall through to
        # index.html rather than a bare Apache 404.
        FallbackResource /index.html
    </Directory>

    # ── API reverse proxy ──────────────────────────────────────────────────
    ProxyPreserveHost On
    ProxyPass /api/ http://backend:3001/api/
    ProxyPassReverse /api/ http://backend:3001/api/

    ErrorDocument 404 /404.html

    ErrorLog  ${APACHE_LOG_DIR}/trekeasy-error.log
    CustomLog ${APACHE_LOG_DIR}/trekeasy-access.log combined
</VirtualHost>
