# Alternative to nginx: serves the frontend build on port 8080 and proxies
# /api to the backend. Requires: mod_rewrite, mod_proxy, mod_proxy_http.

Listen 8080

<VirtualHost *:8080>
    ServerName trekeasy.local
    DocumentRoot /var/www/trekeasy/frontend

    <Directory /var/www/trekeasy/frontend>
        AllowOverride All
        Require all granted
        FallbackResource /index.html
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api/ http://backend:3001/api/
    ProxyPassReverse /api/ http://backend:3001/api/

    ErrorDocument 404 /404.html

    ErrorLog  ${APACHE_LOG_DIR}/trekeasy-error.log
    CustomLog ${APACHE_LOG_DIR}/trekeasy-access.log combined
</VirtualHost>
