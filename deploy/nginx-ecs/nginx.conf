# TrekEasy reverse proxy — ECS/Fargate variant of ../nginx/nginx.conf.
#
# Fargate runs all three containers of a task in one awsvpc network
# namespace, so they share a single loopback interface: there is no
# per-container hostname/DNS the way Compose's service names
# (`backend`, `frontend`) resolve on its bridge network. Every other
# container in the task is reachable at 127.0.0.1 on the port it listens
# on, so the upstreams below use that instead. That is the ONLY
# difference from the Compose config — routes, headers, WebSocket
# handling and 404 behavior are identical.
#
# Baked into the trekeasy-nginx image by deploy/nginx-ecs/Dockerfile and
# pushed as the image ECS runs (see aws/scripts/build-and-push.sh and
# aws/scripts/deploy.sh). Do NOT point ECS at deploy/nginx/Dockerfile —
# that one resolves `backend`/`frontend`, which do not exist in the ECS
# task's network namespace.

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log warn;

    sendfile          on;
    tcp_nopush        on;
    keepalive_timeout 65;

    # socket.io opens a connection with HTTP long-polling and upgrades to a
    # WebSocket only afterwards. A hardcoded `Connection: upgrade` therefore
    # corrupts the polling requests that come first, so mirror back whatever the
    # client actually asked for: `upgrade` on an upgrade request, `close`
    # otherwise.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80 default_server;
        server_name _;

        # Answers only if the request truly reached *this* config. If
        # `curl http://<host>/healthz` does not print `trekeasy-nginx ok`, then
        # something other than this container is serving port 80, and editing
        # the rules below cannot possibly change the result. Check that first,
        # always.
        location = /healthz {
            add_header Content-Type text/plain always;
            return 200 "trekeasy-nginx ok\n";
        }

        error_page 404 /404.html;
        location = /404.html {
            root /usr/share/nginx/html;
            internal;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            # TRUST_PROXY=true makes the backend read these for rate limiting,
            # so they have to actually be sent.
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Real-time chat: socket.io handshake + WebSocket upgrade. Served from
        # the origin root (not under /api), so it needs its own route or it
        # would fall through to the frontend below. Mirrors the /socket.io
        # path in k8s/ingress.yaml.
        location /socket.io/ {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /uploads/ {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Everything else is the Expo web bundle. The frontend image resolves
        # unknown paths to index.html itself (try_files), so SPA deep links work
        # without nginx knowing the route table.
        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
