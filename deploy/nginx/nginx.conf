# TrekEasy reverse proxy: routes /api to the backend and everything else to
# the frontend static build. Runs as the `nginx` service in docker-compose.yml.

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log;

    server {
        listen 80;
        server_name _;

        error_page 404 /404.html;
        location = /404.html {
            root /usr/share/nginx/html;
            internal;
        }

        location /api/ {
            proxy_pass http://backend:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Real-time chat: socket.io handshake + WebSocket upgrade. Served from
        # the origin root (not under /api), so it needs its own route or it
        # would fall through to the frontend below. Mirrors the /socket.io
        # path in k8s/ingress.yaml.
        location /socket.io/ {
            proxy_pass http://backend:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /uploads/ {
            proxy_pass http://backend:3001;
        }

        location / {
            proxy_pass http://frontend:8080;
            proxy_set_header Host $host;
        }
    }
}
