# TrekEasy reverse proxy.
#
# The single public entry point (port 80): routes /api/* to the NestJS
# `backend` service and everything else to the static `frontend` web export.
# Runs as its own container in docker-compose.yml / the `nginx` image in
# Kubernetes, so `backend` and `frontend` never need to be reachable directly.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    gzip  on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Container DNS names from docker-compose.yml / the Kubernetes Services of
    # the same name. Resolved via a variable (rather than baked directly into
    # `proxy_pass`) so nginx does not fail to start if one is briefly
    # unresolvable — it re-resolves lazily per request instead.
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;
        server_name _;

        # Custom 404 — a static page shipped in the nginx image rather than
        # proxied, so it renders even if `backend` is down.
        error_page 404 /404.html;
        location = /404.html {
            root /usr/share/nginx/html;
            internal;
        }

        # ── API ──────────────────────────────────────────────────────────
        location /api/ {
            set $backend_upstream backend:3001;
            proxy_pass http://$backend_upstream;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket upgrade — the chat gateway shares this origin (see
            # backend/src/main.ts's IoAdapter), so socket.io's long-poll /
            # upgrade handshake has to pass through untouched.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Locally-stored profile picture uploads (see backend/src/common/storage.service.ts).
        location /uploads/ {
            set $backend_upstream backend:3001;
            proxy_pass http://$backend_upstream;
            proxy_set_header Host $host;
        }

        # ── Frontend (static Expo web export) ───────────────────────────
        location / {
            set $frontend_upstream frontend:8080;
            proxy_pass http://$frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
