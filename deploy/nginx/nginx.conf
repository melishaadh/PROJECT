# TrekEasy reverse proxy: routes /api, /uploads and /socket.io to the backend
# and everything else to the frontend static build. Baked into the
# trekeasy-nginx image by deploy/nginx/Dockerfile (see that file for why this is
# not bind-mounted), and run as the `nginx` service in docker-compose.yml.

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log warn;

    sendfile          on;
    tcp_nopush        on;
    keepalive_timeout 65;

    # Profile pictures upload as multipart with a 5 MB cap enforced by the
    # backend. nginx's own default is 1 MB, which would reject anything larger
    # with a 413 before the request ever reached Nest — so the proxy has to be
    # the more permissive of the two and let the app own the limit.
    client_max_body_size 6m;

    # Static assets are already gzipped by the frontend image; this covers the
    # JSON coming back from the API, which Nest does not compress itself.
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types      application/json application/javascript text/css text/plain;

    # socket.io opens a connection with HTTP long-polling and upgrades to a
    # WebSocket only afterwards. A hardcoded `Connection: upgrade` therefore
    # corrupts the polling requests that come first, so mirror back whatever the
    # client actually asked for: `upgrade` on an upgrade request, `close`
    # otherwise.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80 default_server;
        server_name _;

        # Answers only if the request truly reached *this* config. If
        # `curl http://<host>/healthz` does not print `trekeasy-nginx ok`, then
        # something other than this container is serving port 80 (a host nginx
        # or apache2 — this repo ships deploy/apache/ too — will happily return
        # 404 from an empty docroot), and editing the rules below cannot
        # possibly change the result. Check that first, always.
        location = /healthz {
            add_header Content-Type text/plain always;
            return 200 "trekeasy-nginx ok\n";
        }

        # Only for 404s nginx generates itself. Upstream 404s pass through
        # untouched because proxy_intercept_errors stays off: the API's own JSON
        # error bodies are what the frontend parses, and replacing them with
        # this HTML page would turn a clear API error into a mystery.
        error_page 404 /404.html;
        location = /404.html {
            root /usr/share/nginx/html;
            internal;
        }

        proxy_intercept_errors off;

        location /api/ {
            include /etc/nginx/proxy_headers.conf;
            proxy_pass http://backend:3001;
        }

        # Real-time chat: socket.io handshake + WebSocket upgrade. Served from
        # the origin root (not under /api), so it needs its own route or it
        # would fall through to the frontend below. Mirrors the /socket.io
        # path in k8s/ingress.yaml.
        location /socket.io/ {
            include /etc/nginx/proxy_headers.conf;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass http://backend:3001;
        }

        location /uploads/ {
            include /etc/nginx/proxy_headers.conf;
            proxy_pass http://backend:3001;
        }

        # Everything else is the Expo web bundle: index.html, the content-hashed
        # entry bundle under /_expo/, and media under /assets/. The frontend
        # image decides what is a real 404 and what is a client-side route.
        #
        # `frontend` is resolved once, at startup — nginx caches proxy_pass
        # hostnames when no `resolver` is configured. If you recreate the
        # frontend alone (`docker compose up -d frontend`) it gets a new IP and
        # this proxy will 502 against the stale one, so restart nginx alongside
        # it: `docker compose up -d --force-recreate frontend nginx`.
        location / {
            include /etc/nginx/proxy_headers.conf;
            proxy_pass http://frontend:8080;
        }
    }
}
