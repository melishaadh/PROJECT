# Headers every proxied location must send, kept in one file and `include`d
# rather than set once at server level.
#
# This is not stylistic. nginx's `proxy_set_header` is an array directive: a
# location that defines even one of its own inherits *none* from the enclosing
# server or http block. Setting these at server level and then adding `Upgrade`
# and `Connection` inside /socket.io/ would silently drop Host and every
# X-Forwarded-* header from exactly the route that needs them most.
#
# X-Forwarded-* are required because the backend runs with TRUST_PROXY=true and
# reads them to attribute rate limiting to the real client rather than to this
# proxy's address.

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
