services:
  mongo:
    build: ./backend-database
    container_name: trekeasy-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-trekeasy}
    volumes:
      - mongo-data:/data/db
    # healthcheck is inherited from backend-database/Dockerfile
    networks: [trekeasy-net]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: trekeasy-backend
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/${MONGO_DB_NAME:-trekeasy}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '3001:3001'
    volumes:
      - backend-uploads:/app/backend/uploads
    # healthcheck is inherited from backend/Dockerfile
    networks: [trekeasy-net]

  frontend:
    build:
      context: ./frontend
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-/api}
    container_name: trekeasy-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # healthcheck is inherited from frontend/Dockerfile
    networks: [trekeasy-net]

  nginx:
    image: nginx:alpine
    container_name: trekeasy-nginx
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/404.html:/usr/share/nginx/html/404.html:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks: [trekeasy-net]

networks:
  trekeasy-net:
    driver: bridge

volumes:
  mongo-data:
  backend-uploads:
