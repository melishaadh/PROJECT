# Serves the Expo web export on port 8080. Copied to
# /etc/nginx/conf.d/default.conf by frontend/Dockerfile, replacing the base
# image's default server (which listens on 80). The image's stock
# /etc/nginx/nginx.conf is kept, so mime.types, sendfile and the worker setup
# all come from upstream.
#
# app.json sets web.output = "single", so the export is a true SPA: one
# index.html, one content-hashed entry bundle under /_expo/static/js/web/, and
# content-hashed media under /assets/.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The entry bundle is ~3.4 MB uncompressed. Serving it raw is the difference
    # between a UI that paints and one that looks like it has hung, especially
    # over a VM bridge or LAN.
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        text/css
        text/javascript
        text/plain;

    # Build output is content-hashed (entry-<hash>.js, <name>.<hash>.ttf), so a
    # changed file always arrives under a new name and these can be cached hard.
    #
    # `=404` is deliberate, and is the important part: these paths must NOT get
    # the SPA fallback below. Falling back to index.html for a missing script
    # answers a .js request with HTML and a 200, so the browser reports a MIME
    # or syntax error rather than the missing file, and the page renders blank
    # with nothing in the network tab that points at the real cause.
    location /_expo/ {
        try_files $uri =404;
        # One header, not `expires` plus `add_header` — that pair emits two
        # separate Cache-Control lines.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html itself must never be cached. It is the only file that names the
    # current bundle hash, so a browser holding a previous copy keeps asking for
    # a bundle that no longer exists after a redeploy — a genuine 404 that the
    # user cannot clear without a hard refresh.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Everything else is an Expo Router route, not a file on disk: hand back the
    # SPA shell and let the client router resolve it. This is what makes a deep
    # link or a page refresh on /login work.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
