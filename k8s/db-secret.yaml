# `data` values are base64-encoded (Kubernetes requirement), NOT encrypted.
# stringData below holds the JWT signing keys in plain text so they stay
# readable/editable; Kubernetes base64-encodes them on apply.
#
# Regenerate a key:  node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: myapp
type: Opaque
data:
  # base64 of: mongodb://mongo:27017/trekeasy
  MONGODB_URI: bW9uZ29kYjovL21vbmdvOjI3MDE3L3RyZWtlYXN5
stringData:
  JWT_SECRET: '29faebf0ef28b1d2ef7feab1028cf1668f5d27881e9c8567145574b5000b2a27'
  JWT_REFRESH_SECRET: '64894320a2f1a8f2b7cea89b2ebf6fc01b59417fa57d68126bd6b1770088adc4'
