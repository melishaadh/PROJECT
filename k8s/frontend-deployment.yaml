# Build the image first. EXPO_PUBLIC_API_URL is inlined into the JS bundle at
# export time (Expo/Metro replaces process.env.EXPO_PUBLIC_* on `expo export`),
# so it MUST be passed as a build arg here — it cannot be a runtime env var on
# the container. A relative "/api" keeps the bundle host-agnostic: the browser
# resolves it against whatever host served the page (app.local via the Ingress),
# and API_ORIGIN collapses to "" so the socket.io client dials the same origin.
#
#   eval $(minikube docker-env) &&
#   docker build -f frontend/Dockerfile \
#     --build-arg EXPO_PUBLIC_API_URL=/api \
#     -t trekeasy-frontend:latest frontend
#
# Rollback: kubectl rollout undo deployment/frontend -n myapp
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: myapp
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: trekeasy-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 10
